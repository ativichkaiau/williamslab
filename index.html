<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved choice before styles load; Auto follows this device.
      (() => {
        let preference = 'auto'
        try { preference = localStorage.getItem('williamslab.theme') || 'auto' } catch {}
        document.documentElement.dataset.theme = preference === 'day' || preference === 'night'
          ? preference
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'
        // 3D unless the saved choice is flat, or the device asks for less motion.
        let dim = null
        try { dim = localStorage.getItem('williamslab.dim') } catch {}
        document.documentElement.dataset.dim = dim === '2d' || dim === '3d'
          ? dim
          : window.matchMedia('(prefers-reduced-motion: reduce)').matches ? '2d' : '3d'
      })()
    </script>
    <link rel="icon" type="image/png" href="/williams.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="WilliamsLab — a translational-research operating system. Stabilize the unknown. Ship the signal." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a1f6b" />
    <link rel="apple-touch-icon" href="/williams.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WilliamsLab" />
    <title>WilliamsLab — Research OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
